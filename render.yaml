services:
  - type: web
    name: frfr
    runtime: node
    plan: free
    branch: arena/01a06b20-shift
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: FRFR_NO_UPDATE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: JSONBLOB_URL
        sync: false
